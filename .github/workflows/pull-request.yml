name: Pull Request Validation

on:
  pull_request:
    branches:
      - dev
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      - name: Select changed tests
        id: changed-tests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          : > "$RUNNER_TEMP/changed-tests"
          while IFS= read -r -d '' file; do
            case "$file" in
              *.test.ts|*.test.tsx|*.test.js|*.test.jsx|*.spec.ts|*.spec.tsx|*.spec.js|*.spec.jsx)
                printf '%s\0' "./$file" >> "$RUNNER_TEMP/changed-tests"
                ;;
            esac
          done < <(git diff --name-only --diff-filter=AM -z "$BASE_SHA" "$HEAD_SHA")
          if [ -s "$RUNNER_TEMP/changed-tests" ]; then
            echo "has-tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-tests=false" >> "$GITHUB_OUTPUT"
            echo "No added or modified tests; test execution skipped."
          fi

      - name: Test changed files
        if: steps.changed-tests.outputs.has-tests == 'true'
        run: |
          mapfile -d '' -t files < "$RUNNER_TEMP/changed-tests"
          pnpm exec vitest run "${files[@]}"

      - name: Build
        run: pnpm run build
